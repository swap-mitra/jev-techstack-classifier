<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which tech stack?</title>
<style>
  :root { --bg:#16161a; --panel:#1f1f24; --line:#2e2e35; --text:#ececf1; --muted:#9a9aa5; --accent:#8b9cff; --bar:#434a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .muted { color:var(--muted); }
  textarea { width:100%; min-height:90px; margin:16px 0 12px; padding:12px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:8px; font:inherit; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent); color:#111; border:0; font-weight:600; padding:9px 18px; font-size:15px; }
  button:disabled { opacity:.5; cursor:wait; }
  .clarify { margin-top:24px; padding:14px; border:1px dashed var(--accent); border-radius:8px; }
  .clarify p { margin:0 0 8px; font-weight:600; }
  .clarify .q + .q { margin-top:12px; }
  h2 { font-size:12px; font-weight:500; color:var(--muted); margin:28px 0 0; text-transform:uppercase; letter-spacing:.05em; }
  .pick { font-size:26px; font-weight:700; margin:0 0 10px; }
  .bar { position:relative; display:flex; justify-content:space-between; padding:7px 10px; margin-bottom:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--bar); }
  .bar span { position:relative; }
  .bar b { position:relative; font-weight:600; }
  .meta { font-size:12px; margin-top:4px; }
  .error { color:#ff8a8a; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Which tech stack?</h1>
  <div class="muted">Describe a project and Jev picks a stack. It is a classification model, so every option gets a probability.</div>
  <textarea id="req" placeholder="Build me a trading mobile app that is very optimised for speed"></textarea>
  <div class="row">
    <button class="primary" id="go">Classify</button>
    <span id="examples" class="row"></span>
    <span class="muted" style="font-size:12px">Ctrl+Enter</span>
  </div>
  <div id="error" class="error" hidden></div>
  <div id="clarify"></div>
  <div id="out"></div>
  <div id="meta" class="muted meta"></div>
</main>
<script>
const EXAMPLES = [
  "Build me a trading mobile app that is very optimised for speed",
  "Internal HR leave tracker for 50 employees at a Microsoft-based company",
  "E-commerce storefront for a small bakery with online ordering",
  "IoT platform collecting temperature readings from 10,000 factory sensors",
  "Analytics dashboard over billions of ad-click events",
];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = s => s.replace(/_/g, " ");

EXAMPLES.forEach((ex, i) => {
  const b = document.createElement("button");
  b.textContent = `Example ${i + 1}`;
  b.onclick = () => { $("req").value = ex; run(); };
  $("examples").append(b);
});
$("go").onclick = run;
$("req").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });

async function run() {
  const requirements = $("req").value.trim();
  if (!requirements) return;
  $("go").disabled = true; $("error").hidden = true;
  try {
    const res = await fetch("/api/recommend", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ requirements }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
  } catch (e) {
    $("error").textContent = e.message; $("error").hidden = false;
  } finally {
    $("go").disabled = false;
  }
}

function render(data) {
  // Clarifying questions: answering appends to the prompt and re-runs.
  $("clarify").innerHTML = data.clarify.length ? `<div class="clarify">${data.clarify.map(c => `
    <div class="q"><p>${esc(c.ask)}</p><div class="row">${c.options.map(o =>
      `<button data-ask="${esc(c.ask)}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}</div>` : "";
  $("clarify").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("req").value = `${$("req").value.trim()}\n${b.dataset.ask} ${b.dataset.opt}.`;
    run();
  });

  $("out").innerHTML = Object.entries(data.layers).map(([layer, [ranked, conf]]) => `
    <h2>${esc(layer)} · confidence ${conf.toFixed(2)}</h2>
    <div class="pick">${esc(label(ranked[0][0]))}</div>
    ${ranked.map(([opt, p]) => `<div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i>
      <span>${esc(label(opt))}</span><b>${Math.round(p * 100)}%</b></div>`).join("")}`).join("");
  $("meta").textContent = `${data.ms} ms · ${data.tokens_in} tokens in, ${data.tokens_out} out`;
}
</script>
</body>
</html>
